services:
  postgres:
    image: postgres
    container_name: postgres
    environment:
      POSTGRES_DB: volunteer-management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: databasepassword
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - volunteer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - volunteer-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api-gateway:
    build:
      context: ./backend
      dockerfile: ./api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Authentication__Schemes__Bearer__SigningKeys__0__Value=DyBOKvk6d/XdolO3XtDu0RFO6GO8LfaP25GVJ5gMh0U=
      - Authentication__Schemes__Bearer__SigningKeys__0__Length=32
      - Authentication__Schemes__Bearer__SigningKeys__0__Issuer=dotnet-user-jwts
      - Authentication__Schemes__Bearer__SigningKeys__0__Id=9e4b3fb7
    depends_on:
      recruitment-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - volunteer-network
    restart: unless-stopped

  recruitment-service:
    build:
      context: ./backend
      dockerfile: ./recruitment-service/Dockerfile
    container_name: recruitment-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - volunteer-network
    restart: unless-stopped

  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: ./Dockerfile
    container_name: notification-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      kafka:
        condition: service_started
    networks:
      - volunteer-network
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    ports:
      - '9092:9092'
      - '9094:9094'
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - ALLOW_PLAINTEXT_LISTENER=yes
    networks:
      - volunteer-network

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    networks:
      - volunteer-network
    depends_on: 
      kafka:
        condition: service_started
    ports:
      - "7777:8080"
    restart: always
    environment:
      KAFKA_BROKERS: kafka:9092

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    networks:
      - volunteer-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
      - frontend
      - recruitment-service
    networks:
      - volunteer-network
    restart: unless-stopped

  init-data:
    image: curlimages/curl:latest
    container_name: init-data
    volumes:
      - ./add_mock_data.sh:/scripts/add_mock_data.sh:ro
    depends_on:
      - nginx
      - api-gateway
      - recruitment-service
    networks:
      - volunteer-network
    command: sh /scripts/add_mock_data.sh
    restart: "no"

networks:
  volunteer-network:
    driver: bridge

volumes:
  postgres-data:
