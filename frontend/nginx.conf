user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    server {
        listen 80;
        server_name localhost;

        # Campaigns micro-frontend
        location /dist/campaigns/ {
            alias /usr/share/nginx/html/dist/campaigns/;
            try_files $uri $uri/ /dist/campaigns/index.html;
        }

        # Registration micro-frontend
        location /dist/registration/ {
            alias /usr/share/nginx/html/dist/registration/;
            try_files $uri $uri/ /dist/registration/index.html;
        }

        # Scheduling micro-frontend
        location /dist/scheduling/ {
            alias /usr/share/nginx/html/dist/scheduling/;
            try_files $uri $uri/ /dist/scheduling/index.html;
        }

        # Host application (main entry point) - must be last
        location / {
            alias /usr/share/nginx/html/dist/host/;
            try_files $uri $uri/ /index.html;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
